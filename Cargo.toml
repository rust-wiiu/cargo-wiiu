[package]
name = "cargo-wiiu"
version = "0.2.1"
edition = "2024"
authors = ["29th-Day"]
description = "Cargo extension to easily work with Nintendo Wii U binaries."
readme = "README.md"
repository = "https://github.com/rust-wiiu/cargo-wiiu"
license-file = "LICENSE"
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
keywords = ["nintendo", "homebrew", "wiiu"]
include = ["Cargo.toml", "Cargo.lock", "LICENSE*", "README*", "src/**/*"]

[dependencies]
anyhow = "1.0.104"
binrw = "0.15.2"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
indextree = "4.8.1"
log = "0.4.33"

[dev-dependencies]
rstest = "0.26.1"

[package.metadata.release]
publish = false
push = true
