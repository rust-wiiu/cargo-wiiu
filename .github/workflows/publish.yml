name: Publish to crates.io

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish:
        environment: publish
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - uses: rust-lang/crates-io-auth-action@v1
              id: auth
            - name: Publish
              run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
